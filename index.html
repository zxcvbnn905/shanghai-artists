                </label>
                -->

    <!-- 项目介绍按钮（右下角，开启/关闭弹窗） -->
    <button id="about-button" type="button" data-i18n-key="about_button">项目介绍</button>

    <!-- 背景音乐 -->
    <audio id="bgm-audio" loop preload="auto" src="music/bgm.mp3"></audio>

    <!-- 静音切换按钮 -->
    <button id="bgm-toggle" class="muted" title="播放背景音乐" aria-label="播放背景音乐">
        <svg viewBox="0 0 24 24" class="note-icon" fill="currentColor">
            <ellipse cx="10" cy="16" rx="4.5" ry="3.2" transform="rotate(-15, 10, 16)" />
            <line x1="13.5" y1="16" x2="13.5" y2="4" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            <path d="M 13.5 4 C 18.5 4, 20 8.5, 17 12.5 C 18 10, 16.5 7.5, 13.5 7.5 Z" fill="currentColor" />
        </svg>
        <svg viewBox="0 0 24 24" class="slash-icon">
            <line x1="3" y1="3" x2="21" y2="21" stroke="#c44" stroke-width="2" stroke-linecap="round" />
        </svg>
    </button>

    <div id="loading-overlay">
            <img src="assets/others/loading.svg" alt="loading" class="loading-spinner">
            <span>Loading...</span>
        </div>

    <!-- 项目介绍弹窗 -->
    <div id="about-overlay" role="dialog" aria-modal="true" aria-labelledby="about-content">
        <div class="about-panel">
            <button id="about-close" type="button" aria-label="关闭弹窗">&times;</button>
            <div id="about-content" class="about-scroll"></div>

            <div id="about-dots" class="about-dots"></div>

            <div id="password-gate-app" v-cloak>
                <label class="pw-label">{{ t('password_label') }}</label>
                <div id="password-panel">
                    <img class="pw-bg" src="assets/secret.png" alt="">
                    <div class="pw-row">
                        <input type="text" v-model="password" class="pw-input"
                               :class="{ error: showError }"
                               @keyup.enter="checkPassword" ref="pwInput">
                        <img class="pw-btn" src="assets/enter.svg" alt="" @click="checkPassword">
                    </div>
                </div>
                <div class="pw-error" v-if="errorMsg">{{ errorMsg }}</div>
            </div>
        </div>
    </div>
